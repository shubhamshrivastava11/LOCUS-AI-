# Keeps LOCUS-AI-APP/LOCUS-AI- in step with this repository.
#
# This repo is where the team works: branches, pull requests, one required
# review. The org repo is the private, company-owned copy that gets shown to
# clients. It runs CI so every commit carries a green check, and its deploy
# workflows are disabled so a push here does not deploy twice.
#
# The gap this closes: a pull request merged through GitHub's web UI is a push
# that happens on GitHub's servers. Nothing runs locally, so a dual-remote
# `git push` on somebody's laptop never fires and the org silently falls
# behind - exactly the divergence that makes two-repo setups rot.
#
# Credential: a FINE-GRAINED personal access token scoped to
# LOCUS-AI-APP/LOCUS-AI- alone, with Contents and Workflows set to write,
# stored here as the MIRROR_TOKEN secret.
#
# An SSH deploy key was tried first and is the better credential in every
# respect but the one that decides it: GitHub refuses to let a deploy key
# create or modify anything under .github/workflows/, and this mirror has to
# carry workflow files or the org's CI quietly rots into a copy of whatever
# the workflows looked like the day the mirror was set up. A fine-grained
# token is the tightest credential that can actually do the job - unlike a
# classic PAT it reaches exactly one repository, so a leak is still a
# one-repo problem and revoking it is one click.
#
# No loop risk, by construction: this file gets mirrored too, so the org repo
# ends up holding a copy of it. The `if` on the job below means that copy
# never does anything. Without it every mirrored push would start a job on
# the org side that pushes the org to itself - harmless, since an identical
# ref is a no-op and no new push event follows, but it would quietly double
# the billed job minutes for nothing.

name: Mirror to org

on:
  push:
    branches: [main]
  # So the org can be re-synced by hand after any manual divergence, without
  # having to invent a commit to trigger it.
  workflow_dispatch:

concurrency:
  # Serialised, and NOT cancel-in-progress: two mirror runs racing could push
  # an older commit last and leave the org behind the newer one. Letting each
  # finish costs a few seconds and removes that ordering hazard entirely.
  group: mirror-to-org
  cancel-in-progress: false

jobs:
  mirror:
    name: Push main to LOCUS-AI-APP/LOCUS-AI-
    # Only the source repo mirrors. See the note at the top of this file.
    if: github.repository == 'Abbas-Rahman-c/locus-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 is required. The default shallow clone has no
          # ancestry, so the push is rejected as a non-fast-forward against a
          # repo that already has the history.
          fetch-depth: 0
          # Do not leave the checkout token in .git/config. The push below
          # uses its own credential, and an unused token sitting in the
          # working copy is just a second thing that could be misused.
          persist-credentials: false

      - name: Push to the org repo
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${MIRROR_TOKEN:-}" ]; then
            echo "::error::MIRROR_TOKEN is not set. Create a fine-grained token scoped"
            echo "to LOCUS-AI-APP/LOCUS-AI- with Contents: write and Workflows: write,"
            echo "then add it as the MIRROR_TOKEN repository secret."
            exit 1
          fi

          # The token is interpolated into the URL for this one command rather
          # than written into git config, so it never lands on the runner's
          # disk. Actions masks it in the log either way; not persisting it is
          # the stronger of the two guarantees.
          #
          # A plain push, never --force. If the two repos have genuinely
          # diverged this fails loudly and somebody looks at it, which is the
          # right outcome. A forced mirror would quietly destroy whatever was
          # on the org side, and "quietly destroys things" is precisely the
          # failure mode worth avoiding in a job nobody is watching.
          git push "https://x-access-token:${MIRROR_TOKEN}@github.com/LOCUS-AI-APP/LOCUS-AI-.git" \
            HEAD:refs/heads/main

          echo "Mirrored \`$(git rev-parse --short HEAD)\` to LOCUS-AI-APP/LOCUS-AI-" >> "$GITHUB_STEP_SUMMARY"
