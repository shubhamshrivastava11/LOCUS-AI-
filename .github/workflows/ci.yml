# Checks that run on every push and every pull request, on every branch.
#
# deploy.yml gates the FRONTEND deploy. Nothing gated the backend at all: 41
# edge functions and two test suites were only ever run by someone choosing to
# run them locally. That is the half of the codebase holding the data, so it is
# the half most worth checking automatically.
#
# Kept separate from deploy.yml deliberately. This runs everywhere, including
# branches that will never deploy, so a problem is visible before the merge
# rather than at the moment of shipping.

name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Edge functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Typechecks every function entrypoint, which pulls in all of _shared
      # with it. This catches the Deno-side equivalent of the TS2307 that took
      # two failed deploys to surface on the frontend.
      # --node-modules-dir=none is not a CI workaround, it is the accurate
      # check. The repo root has a package.json, so Deno otherwise resolves
      # npm: specifiers through a local node_modules that exists on a
      # developer machine and never on a fresh checkout - nor in Supabase's
      # runtime, which has no node_modules at all. Without it this step
      # passes locally and fails here, which is the same split that cost two
      # deploys on the frontend.
      - name: Typecheck
        run: deno check --node-modules-dir=none supabase/functions/*/index.ts

      # financialRedaction.test.ts and temporal.test.ts. 24 tests covering
      # redaction of anything money-shaped before it is stored, and the
      # valid_from/valid_until boundary rules the temporal model depends on.
      - name: Tests
        run: deno test --node-modules-dir=none --allow-all supabase/functions/_shared/

      # loci-chat is the marketing-site widget. It is unauthenticated, rate
      # limited, and answers from canned product facts held in its own loci_*
      # tables. No tenant data has ever reached it and the whole design depends
      # on that staying true, so it is asserted rather than remembered - the
      # same reasoning as the frontend's import-escape guard in deploy.yml.
      #
      # `decisions` and `raw_events` are the content tables; withTenant is the
      # only way to read them under a tenant. A legitimate need would mean the
      # widget had stopped being a marketing widget.
      - name: loci-chat reaches no tenant data
        run: |
          if grep -nE "withTenant|\bpublic\.decisions\b|\bpublic\.raw_events\b|from\(\"decisions\"\)" supabase/functions/loci-chat/index.ts; then
            echo "::error::loci-chat must never query tenant content."
            exit 1
          fi
          echo "loci-chat touches no tenant content."

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # The same command Vercel runs, so a green check here means the deploy
      # will typecheck too.
      - name: Typecheck
        run: npx tsc -b

      # Fails on errors, not warnings. There are warnings today and they are
      # not worth blocking on; an actual error is.
      - name: Lint
        run: npx oxlint
