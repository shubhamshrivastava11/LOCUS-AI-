# Deploys the frontend to Vercel on every push to main.
#
# Why a workflow instead of Vercel's own Git integration: connecting a
# PRIVATE GitHub ORGANISATION repo to Vercel requires a Pro plan. The CLI
# has no such restriction, so this drives it directly with a token and gets
# push-to-deploy on the Hobby plan.
#
# Deliberately NOT using --prebuilt. Building here would mean copying the
# VITE_* values into GitHub secrets as well, giving two places to keep in
# sync and two places to leak from. Uploading the source and letting Vercel
# build means the environment variables live in exactly one place: the
# Vercel project.
#
# Required GitHub repository secrets (Settings > Secrets and variables >
# Actions):
#   VERCEL_TOKEN       - Vercel account token, from vercel.com/account/tokens
#   VERCEL_ORG_ID      - from .vercel/project.json after `vercel link`
#   VERCEL_PROJECT_ID  - from .vercel/project.json after `vercel link`
#
# Note on VERCEL_TOKEN: it grants full access to the Vercel account, and
# anyone who can push a workflow change to this repo can read it. Scope it
# to the Locus AI team and rotate it if someone leaves.

name: Deploy to Vercel

on:
  push:
    branches: [main]
  # Manual trigger, for redeploying without an empty commit.
  workflow_dispatch:

# One deploy at a time. Two pushes in quick succession would otherwise race
# and the older build could land last.
concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Typecheck before deploying. `vercel build` would catch this too, but
      # failing here is faster and the error is easier to read than it is
      # buried in Vercel's build log.
      - name: Install and typecheck
        working-directory: frontend
        run: |
          npm ci
          npx tsc -b

      # Vercel's Root Directory for this project is `frontend`, so a build
      # only ever receives frontend/. An import that climbs out of it
      # resolves fine here - the whole repo is checked out - and then fails
      # on Vercel with TS2307. That is exactly how the first two runs of
      # this workflow were lost, so it is checked rather than remembered.
      - name: No imports outside the deploy root
        run: |
          if grep -rnE "from +['\"]\.\./\.\./\.\./" frontend/src frontend/landing-page; then
            echo "::error::An import above frontend/ will not exist in the Vercel build."
            exit 1
          fi
          echo "No imports escape frontend/."

      - name: Deploy to production
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel@latest deploy --prod --yes --logs \
            --token="${{ secrets.VERCEL_TOKEN }}" > deployment-url.txt
          echo "Deployed: $(cat deployment-url.txt)"
          echo "### Deployed" >> $GITHUB_STEP_SUMMARY
          echo "$(cat deployment-url.txt)" >> $GITHUB_STEP_SUMMARY
