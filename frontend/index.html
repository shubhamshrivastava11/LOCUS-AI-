<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- favicon.svg is a different, unused mark - the real Locus AI logo
         (the one in the nav header on every page) is locuslogo.png. Referenced
         from src/assets (not public/) so Vite fingerprints the filename - a
         public/ path never changes URL when the image content changes,
         which left browsers serving a stale cached logo after the real-logo
         swap even though the server had the new file. -->
    <link rel="icon" type="image/png" href="/src/assets/locuslogo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- These are the only tags a crawler or a link unfurler ever sees. The
         app sets document.title per route (PAGE_TITLES in App.tsx), but that
         runs in JavaScript, long after Slack, WhatsApp, LinkedIn or Google
         have taken what they came for. So the static values below describe
         "/" logged out, which is the landing page, not the sign-up screen the
         old title claimed.
         Wording is verbatim from landing-page/GetStarted.tsx so the preview
         and the page cannot drift apart. -->
    <title>Locus AI · Turn everyday work into organizational memory</title>
    <meta
      name="description"
      content="Locus AI builds memory from your Slack, Notion and Gmail workspaces, so your team can ask anything it already knows, with links back to the source."
    />
    <meta name="theme-color" content="#5b52e8" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Locus AI" />
    <meta property="og:url" content="https://locusaiapp.com/" />
    <meta property="og:title" content="Turn everyday work into organizational memory" />
    <meta
      property="og:description"
      content="Locus AI builds memory from your Slack, Notion and Gmail workspaces, so your team can ask anything it already knows, with links back to the source."
    />
    <!-- Deliberately NOT fingerprinted, unlike the logo above. An unfurler
         caches a card against its URL for weeks, so a filename that changed
         on every build would keep re-fetching and would break every link
         already shared. If the card itself is ever redrawn, bump this to
         og-card.png?v=2 rather than renaming the file. -->
    <meta property="og:image" content="https://locusaiapp.com/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Locus AI: turn everyday work into organizational memory"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Turn everyday work into organizational memory" />
    <meta
      name="twitter:description"
      content="Locus AI builds memory from your Slack, Notion and Gmail workspaces, so your team can ask anything it already knows, with links back to the source."
    />
    <meta name="twitter:image" content="https://locusaiapp.com/og-card.png" />
    <!-- locusaiapp.com and www.locusaiapp.com both serve identical content
         with no redirect between them, which Google Search Console flagged
         as "Duplicate without user-selected canonical" - it won't index
         either copy until one is declared authoritative. This doesn't fix
         the underlying duplicate (that needs a www->apex redirect at the
         DNS/Vercel domain level), just tells Google which one to trust. -->
    <link rel="canonical" href="https://locusaiapp.com/" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="/loci-widget.js" defer></script>
  </body>
</html>
